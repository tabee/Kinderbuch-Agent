[project]
name = "kinderbuch-agent"
version = "0.1.0"
description = "kb — bilingual (EN/TH) illustrated children's books, from idea to print-ready PDF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "weasyprint>=62",
]

[project.scripts]
kb = "kb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
