slug: swiss-thai-myths
name: Swiss-Thai Myths
description: >
  A gentle storybook world where Swiss alpine folklore meets Thai mythology:
  snow-capped mountains and rice terraces, chalets and floating markets,
  friendly mountain spirits and kind naga guardians. Stories celebrate
  curiosity, kindness, and the joy of two cultures meeting.
languages: [en, th]
style_guide: >
  Warm watercolor illustrations with soft edges and gentle light. Rounded,
  friendly character shapes with large expressive eyes. A palette of alpine
  greens, warm golds, and Thai temple reds. No harsh shadows, nothing scary;
  every scene readable at a glance by a 4-6 year old.
