slug: fliegenpilz
name: Flieg Fliegenpilz
description: Ein kleiner Fliegenpilz hat einen grossen Wünsch. Er will fliegen. Er
  wünscht sich das so sehr, dass er eines tages überglücklich ist als eine Schamanin
  ihn pflückt und in den Korb legt. Er denkt der Korb ist sowas wie ein Flugzeug und
  freut sich mehr vom Wald zu sehen. Die Geschichte ist fertig als die Schamanin aus
  dem Wald herauskommt.
languages:
- de
- th
style_guide: Auarell, pantone Farben, so dass es ein Kind 2Jahre alt verstehen kann
