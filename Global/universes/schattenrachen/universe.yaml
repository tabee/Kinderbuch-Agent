slug: schattenrachen
name: Schattenrachen
description: An endless, lightless forest of twisted, bone-white trees that slowly
  close in. Children who enter never come back the same — if they come back at all.
  The trees whisper their real names. The only colours allowed are the glowing red
  eyes that watch from the dark, the blood that seeps from the bark, and the rare
  cursed fires that lure the lost deeper. No maps work. Time bends. The forest is
  hungry.
languages:
- de
- en
style_guide: black and white manga, high contrast ink; strictly monochrome except
  a single pure red accent colour reserved for rare glowing highlights (eyes, embers,
  firelight)
