slug: alpine-monsoon
name: Alpine Monsoon
description: 'A contemporary realist world stretched between a Swiss-German alpine
  village and the Chao Phraya delta of Thailand. Two landscapes bound by one family
  and one changing climate: retreating glaciers and failing ski seasons on one side,
  rising water and drowned rice paddies on the other. Stories are honest about conflict
  - between generations, between economy and ecology, between two identities in one
  person - but always find agency and hope.'
languages:
- en
- th
style_guide: 'Cinematic graphic-novel illustration for young adults: detailed ink
  linework with muted watercolor washes, dramatic natural light, realistic proportions
  and authentic Swiss and Thai environments. Moody atmospheric skies, glacial blues
  against monsoon greens. Emotionally expressive faces, no cartoonishness, no cuteness.'
