slug: ruebenzahn
name: Rübezahl aus dem Riesengebirge
description: 'The entire environment is a vast, cold, wet mountainous landscape, modern
  Scandinavian children''s book illustration style, vector art, linocut print texture.
  The world is composed of sharp geometric origami-like mountains and blocky terrain.
  The atmosphere is damp and misty. A dominant color palette of deep charcoal grays,
  slate blues, and misty silver-gray, accented by sharp contrasts of mustard yellow
  and vibrant fuchsia. The ground is made of stylized, flat-shaded wet rocks and sharp
  geometric puddles reflecting the sky. Overcast pattern-based sky with stylized dark
  gray storm clouds and fuchsia-tinted rain streaks. Trees are minimalist, hard-edged
  geometric triangles. Highly structured flat 2D composition, clean distinct outlines,
  whimsical yet moody atmosphere, uniform world-building style across a series, no
  human or animal characters '
