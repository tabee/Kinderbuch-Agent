schema_version: 1
slug: r
title: Die Legende von Rübenzahl (The Turnip Counter)
universe_slug: ruebenzahn
languages:
- en
- th
age_group: 4-6
spreads: 10
idea: 'The legendary mountain spirit of the Giant Mountains falls in love with Princess
  Emma while she is bathing in a waterfall, kidnapping her to his subterranean palace.
  To cure her intense homesickness, the spirit gifts her a basket of turnips and a
  magic wand that transforms the vegetables into her beloved friends and handmaidens,
  but they soon wither into dust. Exploiting his desperate desire to win her hand
  in marriage, the clever princess tricks the spirit into a challenge: he must count
  every single turnip growing in the field to prove his devotion. While the prideful
  mountain spirit is completely distracted, repeatedly losing count on the field,
  Emma transforms the final fresh turnip into a magical stallion and escapes back
  to her kingdom, leaving the outsmarted spirit to be forever mocked by humans as
  "Rübezahl"—the turnip counter.'
outline:
  title: Die Legende von Rübenzahl (The Turnip Counter)
  premise: When a lonely, obsessive mountain spirit lures Princess Emma to a cursed
    waterfall, he imprisons her in his shadowy palace beneath the Giant Mountains.
    To manipulate her despair, he conjures magical turnips that briefly transform
    into her friends—only to wither into ash, deepening her anguish. Desperate to
    escape, Emma exploits his dark compulsion to count, challenging him to tally an
    infinite field of turnips. As the spirit descends into manic obsession, losing
    himself in the endless rows, Emma performs a final, forbidden spell that transforms
    the last turnip into a black stallion wreathed in shadow. She flees into the darkness,
    but the spirit's curse follows her forever—he is condemned to eternally count
    turnips in the depths, known as Rübezahl, the Turnip Counter, a warning of greed
    and obsession that devours the soul.
  page_synopses:
  - 'Page 1: Princess Emma wanders alone through a twisted, mist-shrouded forest in
    the Giant Mountains. She discovers a waterfall with sickly green water that glows
    with an unnatural, hypnotic light. Strange whispers echo from the depths.'
  - 'Page 2: A gaunt, spectral mountain spirit materializes from the stone and mist,
    his eyes hollow and obsessed. He reaches for Emma with long, skeletal fingers,
    and she cannot resist his pull as he drags her screaming into the earth below.'
  - 'Page 3: Emma awakens in a vast underground palace of jagged black stone and dim,
    flickering mineral light. The walls seem to breathe. She is trapped behind invisible
    barriers, watching a distant, unreachable opening to the surface world above.'
  - 'Page 4: The spirit presents Emma with a basket of withered, blackened turnips
    and forces a cursed wand into her trembling hands. When she reluctantly waves
    it, the turnips briefly shimmer into ghostly images of her loved ones—pale, silent,
    and sorrowful.'
  - 'Page 5: The magical companions scream silently as they crumble to dust in Emma''s
    arms, their faces twisted in anguish. The spirit watches with cold indifference,
    his obsession growing darker as Emma''s despair deepens with each cruel cycle.'
  - 'Page 6: In her darkest hour, Emma realizes the spirit''s weakness: his manic
    obsession with counting and control. She challenges him to count every turnip
    in the endless underground field, knowing his pride and compulsion will consume
    him entirely.'
  - 'Page 7: The spirit descends into the vast, nightmarish field of gnarled, twisted
    turnips that stretch into infinite darkness. His eyes gleam with feverish intensity
    as he begins counting, his voice becoming hollow and repetitive, almost inhuman.'
  - 'Page 8: Days blur together as the spirit counts obsessively, his form growing
    more skeletal and ghostly. He loses count repeatedly, clawing at the earth in
    frustration and rage, his mind fracturing as the numbers spiral into madness and
    despair.'
  - 'Page 9: While the spirit writhes in obsessive torment, Emma whispers a dangerous,
    forbidden incantation over the final turnip. It transforms into a magnificent
    black stallion with eyes like burning coals. She mounts the creature and races
    through the shadowed tunnels toward the world above.'
  - 'Page 10: Emma escapes into the mortal world, forever changed and haunted by her
    captivity. The spirit remains trapped below, eternally counting turnips in the
    darkness, his curse unbreakable—known as Rübezahl, the Turnip Counter, a cautionary
    tale of obsession that destroys both captor and captive.'
story:
  beats:
  - narrative: Princess Emma walked through the misty mountains, looking for adventure.
      The trees whispered softly all around her. Then she found something magical—a
      waterfall that glowed with the most beautiful green light. Emma stepped closer
      to see what it could be.
  - narrative: A tall, shadowy figure rose up from the rocks and mist. He had kind
      eyes that looked very, very sad and lonely. He reached out his hand to Emma
      and asked her to come play with him underground. Before Emma could say no, he
      gently pulled her down, down, down beneath the earth.
  - narrative: Emma woke up in a palace made of dark, shiny stone that sparkled like
      stars. The walls glowed softly with magical light. She could see a tiny opening
      far, far above where the sun shone, but she couldn't reach it. She was in the
      spirit's special home deep underground.
  - narrative: The spirit gave Emma a basket full of round, bumpy turnips and a silver
      wand. When Emma waved the wand, something wonderful happened—the turnips turned
      into pictures of her friends and family! They looked so real, Emma wanted to
      hug them tight.
  - narrative: But then something sad happened. The pictures of her loved ones began
      to fade like smoke. They turned back into turnips and crumbled into dust in
      Emma's hands. The spirit watched and watched, and Emma's heart felt very, very
      heavy.
  - narrative: Emma sat alone and thought very hard. She noticed something about the
      spirit—he loved to count and organize everything, over and over again. She had
      an idea. Emma asked him if he could count every single turnip in his whole field.
      The spirit's eyes lit up with excitement.
  - narrative: 'The spirit ran to his enormous field of turnips that stretched and
      stretched into the darkness. He started counting: one, two, three, four, five!
      His voice grew louder and faster as he counted and counted. He couldn''t stop—he
      didn''t want to stop!'
  - narrative: Day after day, the spirit counted and counted without sleeping. His
      voice became quieter and sadder. Sometimes he lost count and had to start all
      over again. He looked thinner and more tired, but he couldn't stop counting,
      no matter what.
  - narrative: While the spirit was busy counting far away, Emma found the very last
      turnip. She whispered a special, secret spell over it. The turnip sparkled and
      grew into a beautiful black horse with eyes like stars! Emma climbed onto the
      horse's back and rode toward the light above.
  - narrative: Emma rode up, up, up and burst out into the sunny world above. She
      was free! But far below, the spirit is still counting his turnips, over and
      over, forever and ever. He is called Rübezahl now—the Turnip Counter—a reminder
      that being too greedy makes us very, very sad.
characters:
- slug: princess-emma
  name: Princess Emma
  role: The adventurous protagonist who discovers the spirit's palace and escapes
    through cleverness
  description: A young, brave princess who ventures into misty mountains seeking adventure.
    She is kind-hearted and resourceful, using her wit to outsmart the spirit and
    regain her freedom. Emma is curious, observant, and discovers the spirit's weakness
    for counting and order.
  primary_reference: references/princess-emma.png
  visual_keywords:
  - Long golden blonde hair
  - Pink silk dress with white lace trim
  - Small golden crown with jewels
  - White leather boots
- slug: rubezahl-the-spirit
  name: Rübezahl (The Spirit)
  role: The lonely, magical spirit who lives underground and becomes obsessed with
    counting turnips
  description: A tall, shadowy figure with kind but deeply sad and lonely eyes. He
    dwells in the dark stone palace beneath the earth and is driven by an compulsive
    need to count and organize. His form is ethereal and mystical, glowing faintly
    with magical energy. Over time, he becomes increasingly tired and thin from endless
    counting.
  primary_reference: references/rubezahl-the-spirit.png
  visual_keywords:
  - Tall shadowy form with wispy edges
  - Large, sorrowful luminous eyes
  - Dark grey or charcoal robes
  - Glowing pale blue aura around body
- slug: the-star-eyed-horse
  name: The Star-Eyed Horse
  role: The magical escape companion created from the enchanted final turnip
  description: A beautiful black horse conjured from the last turnip through Emma's
    secret spell. It has eyes that shimmer like stars and serves as Emma's means of
    escape from the underground palace back to the sunlit world above.
  primary_reference: references/the-star-eyed-horse.png
  visual_keywords:
  - Glossy jet-black coat
  - Eyes that sparkle like white stars
  - Flowing dark mane
  - Graceful, elegant legs
