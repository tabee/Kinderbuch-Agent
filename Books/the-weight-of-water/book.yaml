- slug: leo-z-rcher
  name: Leo Zürcher
  role: Nik's best friend — local village boy, son of a snow-cannon investor, loyal
    despite conflicting loyalties
  description: 'A good-natured, genuinely enthusiastic teenage boy who loves Grindelbach
    with uncomplicated pride and whose warmth fills whatever room he occupies. He
    grins beside his father at the glossy planning brochure with real pride, not cynicism.
    When the moment demands it, he shows up at Nik''s side at the village council
    without being asked — choosing friendship over his father''s investment. He is
    the social warmth of the story: easy in large kitchens, easy in crowds.'
  primary_reference: references/leo-z-rcher.png
  visual_keywords:
  - open wide grin in brightly-lit family kitchen
  - standing shoulder-to-shoulder with Nik at the council lectern
  - snow cannon planning brochure held in both hands
  - glacier measuring stake gripped alongside Nik
  - posture of uncomplicated belonging in a crowded village room
- slug: frau-becker
  name: Frau Becker
  role: Nik's science teacher — methodical mentor who equips Nik with the tools of
    precise observation
  description: A focused, practical schoolteacher whose presence in the narrative
    is felt through the objects she provides and the instructions she writes. Her
    red-penned handwriting on the inside cover of a thick cream notebook — 'Write
    down what you see. Both places. Don't decide what it means yet.' — becomes Nik's
    guiding discipline. She connects local glacier archive data to Nik's investigation,
    quietly enabling the central revelation without commanding the stage.
  primary_reference: references/frau-becker.png
  visual_keywords:
  - red-pen handwriting on notebook's inside cover
  - thick cream-paged field notebook she selected and gifted
  - university glacier survey archive documents spread open
  - teacher's desk implied by precise instructional notes
  - absent figure whose red ink is always present on the page
- slug: grossvater-ernst
  name: Grossvater Ernst
  role: Nik's deceased maternal grandfather — spectral anchor of memory and the glacier's
    living past
  description: Known only through a single worn photograph, Ernst is a laughing older
    man photographed in brilliant white July ice with skis over one shoulder, at a
    point on the glacier four hundred metres higher than it stands today. He never
    appears in person but is present in every scene through the softened edges of
    the photograph Nik handles constantly. He is the human face of what has been lost
    — cheerful, physical, irretrievable.
  primary_reference: references/grossvater-ernst.png
  visual_keywords:
  - softening-edged black-and-white photograph
  - skis slung over one shoulder on bright white ice
  - laughing expression caught mid-moment
  - image held under Nik's thumb as a tactile comfort
  - figure existing only within a photo's fading border
