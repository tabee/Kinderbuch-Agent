number: 3
text:
  en: At seven in the evening the farmhouse kitchen smelled of lemongrass and coconut
    milk beginning to simmer. Nik sat at the table with homework he wasn't doing,
    watching his mother Malee move between stove and chopping board — unhurried, certain.
    When the phone rang, her shoulders stiffened in the way he'd learned to read like
    weather. Somchai was standing in floodwater that had reached his kitchen table
    for the third time in four years, his voice flat and precise — a man reporting
    facts, not asking for help. Malee hung up and stood very still. Then she turned
    and looked at her son. A thousand kilometres away, her niece Dao was marking the
    waterline on a doorframe with a pencil.
  th: เวลาเจ็ดโมงเย็น ครัวของบ้านฟาร์มหอมกลิ่นตะไคร้และกะทิที่เริ่มเคี่ยว นิคนั่งอยู่กับการบ้านที่ไม่ได้ทำ
    มองมาลีแม่ของเขาเดินไปมาระหว่างเตาและเขียงอย่างไม่รีบร้อน เมื่อโทรศัพท์ดังขึ้น
    ไหล่ของเธอแข็งทื่อในแบบที่เขาเรียนรู้ที่จะอ่านได้เหมือนสัญญาณฟ้าฝน สมชายกำลังยืนอยู่ในน้ำท่วมที่ขึ้นถึงโต๊ะครัวเป็นครั้งที่สามในสี่ปี
    เสียงของเขาราบเรียบและแม่นยำ — ชายที่รายงานข้อเท็จจริง ไม่ใช่ขอความช่วยเหลือ มาลีวางโทรศัพท์และยืนนิ่งอยู่ครู่หนึ่ง
    แล้วหันมามองลูกชาย ห่างออกไปหนึ่งพันกิโลเมตร หลานสาวของเธอชื่อดาวกำลังขีดเส้นดินสอบันทึกระดับน้ำไว้บนวงกบประตู
image_prompt: 'A split-composition illustration rendered in rich, moody gouache. On
  the left half: a warm Swiss farmhouse kitchen at night, lit by hanging pendant light
  and the amber glow of a stovetop. A teenage boy (Nik, ~13, mixed Swiss-Thai features,
  dark hair, school-worn clothes) sits at a wooden table with an open notebook, pencil
  set down, watching his mother intently. His mother Malee (Thai woman, early 40s,
  hair loosely pinned, wearing an apron over a sweater) stands with her back to the
  viewer, holding an old cordless phone to her ear, shoulders subtly braced — rigid
  with composed grief. A clay pot simmers on the stove behind her, releasing wisps
  of steam. On the right half: a flooded Thai farmhouse interior at night, lit only
  by a single kerosene lamp on a salvaged wooden table half-submerged in dark, still
  water. A fifteen-year-old girl (Dao, Thai, slight and focused, hair pulled back)
  stands near the door in bare feet, reaching up with a pencil to mark the doorframe.
  Three faint earlier marks are visible below the current waterline. Her shadow falls
  long and dramatic across the surface of the floodwater. The two halves are divided
  by a thin vertical column of darkness — the same night, opposite ends of the world.
  Palette: the Swiss side warm amber and sage; the Thai side indigo, shadow, and lamplight
  gold. Style: atmospheric, literary YA illustration with strong use of light, shadow,
  and implied silence.

  Edit: Make the kitchen scene warmer: golden evening light through the window, steam
  rising from the pot, the mother holding the phone in the foreground'
