number: 3
text:
  en: 'At seven in the evening the farmhouse kitchen smelled of lemongrass and galangal
    and the particular sweetness of coconut milk beginning to simmer, and Nik sat
    at the table doing homework he was not actually doing. His mother Malee moved
    between the stove and the chopping board the way she always cooked — unhurried,
    certain, as if she had brought a different understanding of time with her from
    Bangkok and simply never exchanged it for the Swiss version. The tom kha was her
    brother''s recipe, or close enough: Somchai had always been the better cook, she
    said, the one with patience. The phone rang on the counter, and the moment she
    picked it up her whole body changed — a slight stiffening at the shoulders, a
    careful stillness that Nik had learned to read like weather. He put down his pencil.
    On the other side of the world, at three in the morning, his uncle Somchai was
    standing in water that had reached his kitchen table for the third time in four
    years, and his voice on the crackly line was the voice of a man reporting a fact
    rather than asking for help, because some men grieve by staying precise. Malee
    asked short questions in Thai, and Nik caught the words for ''high'' and ''again''
    and ''the seedlings'', and the room got very quiet except for the simmering pot.
    Across the split of that same hour, in a farmhouse in the Chao Phraya delta, Somchai''s
    daughter Dao was doing what Dao always did when the water came: she was measuring
    — a pencil mark on the doorframe wall, dated in her small neat handwriting, below
    three earlier marks from three earlier floods, the lamp on the salvaged table
    throwing her shadow long across the water''s surface. She was fifteen, and she
    measured the world because measuring it was the only way she''d found to keep
    it from feeling entirely unmeasurable. Nik''s mother hung up the phone and stood
    at the stove for a moment without turning around, and then she turned around,
    and she looked at her son with the expression of a woman who has just made a decision
    she''s been circling for months.'
  th: เวลาเจ็ดโมงเย็น ครัวของบ้านฟาร์มคลุ้งไปด้วยกลิ่นตะไคร้และข่า และกลิ่นหวานอ่อนๆ
    ของกะทิที่เริ่มเคี่ยว นิคนั่งอยู่ที่โต๊ะพร้อมการบ้านที่เขาไม่ได้ทำจริงๆ แม่ของเขา
    มาลี เดินไปมาระหว่างเตาและเขียงในแบบที่เธอทำอาหารเสมอ — ไม่รีบร้อน มั่นคง ราวกับว่าเธอพกความเข้าใจเรื่องเวลาแบบอื่นมาจากกรุงเทพฯ
    และไม่เคยแลกเปลี่ยนมันกับเวลาแบบสวิสเลย ต้มข่าสูตรนี้เป็นของพี่ชายเธอ หรือใกล้เคียงพอ
    สมชายเป็นคนทำอาหารเก่งกว่าเสมอ เธอบอก เขาเป็นคนที่มีความอดทน โทรศัพท์บนเคาน์เตอร์ดังขึ้น
    และทันทีที่เธอรับสาย ร่างกายทั้งหมดของเธอเปลี่ยนไป — ไหล่แข็งทื่อขึ้นเล็กน้อย
    มีความนิ่งอย่างระมัดระวังที่นิคเรียนรู้ที่จะอ่านได้เหมือนอ่านสัญญาณฟ้าฝน เขาวางดินสอลง
    ที่อีกฝั่งของโลก ตีสามยามดึก ลุงสมชายกำลังยืนอยู่ในน้ำที่ท่วมถึงโต๊ะครัวของเขาเป็นครั้งที่สามในสี่ปี
    และเสียงของเขาบนสายที่แตกพร่าเป็นเสียงของชายคนหนึ่งที่รายงานข้อเท็จจริง ไม่ใช่ขอความช่วยเหลือ
    เพราะผู้ชายบางคนโศกเศร้าโดยการยึดมั่นในความแม่นยำ มาลีถามคำถามสั้นๆ เป็นภาษาไทย
    และนิคจับได้ถึงคำว่า 'สูง' และ 'อีกแล้ว' และ 'ต้นกล้า' และห้องก็เงียบลงมาก นอกจากเสียงฟู่ของหม้อที่เคี่ยวอยู่
    ในช่วงเวลาเดียวกันนั้น ที่บ้านฟาร์มในสามเหลี่ยมปากแม่น้ำเจ้าพระยา ดาว ลูกสาวของสมชาย
    กำลังทำสิ่งที่ดาวทำเสมอเมื่อน้ำมา นั่นคือการวัด — รอยดินสอบนผนังวงกบประตู เขียนวันที่ด้วยลายมือเล็กเรียบร้อยของเธอ
    ต่ำกว่ารอยก่อนหน้าสามรอยจากน้ำท่วมสามครั้งก่อน แสงตะเกียงบนโต๊ะที่กอบกู้มาได้ทอดเงาของเธอยาวข้ามผิวน้ำ
    เธออายุสิบห้า และเธอวัดโลกเพราะการวัดมันเป็นหนทางเดียวที่เธอค้นพบว่าจะไม่ให้โลกรู้สึกว่ายากจะวัดได้เสียทีเดียว
    แม่ของนิควางโทรศัพท์และยืนอยู่ที่เตาสักครู่โดยไม่หันหลังกลับ แล้วเธอก็หันกลับมา
    และมองลูกชายด้วยสีหน้าของผู้หญิงที่เพิ่งตัดสินใจในสิ่งที่เธอวนเวียนอยู่กับมันมาหลายเดือนแล้ว
image_prompt: 'A split-composition illustration rendered in rich, moody gouache. On
  the left half: a warm Swiss farmhouse kitchen at night, lit by hanging pendant light
  and the amber glow of a stovetop. A teenage boy (Nik, ~13, mixed Swiss-Thai features,
  dark hair, school-worn clothes) sits at a wooden table with an open notebook, pencil
  set down, watching his mother intently. His mother Malee (Thai woman, early 40s,
  hair loosely pinned, wearing an apron over a sweater) stands with her back to the
  viewer, holding an old cordless phone to her ear, shoulders subtly braced — rigid
  with composed grief. A clay pot simmers on the stove behind her, releasing wisps
  of steam. On the right half: a flooded Thai farmhouse interior at night, lit only
  by a single kerosene lamp on a salvaged wooden table half-submerged in dark, still
  water. A fifteen-year-old girl (Dao, Thai, slight and focused, hair pulled back)
  stands near the door in bare feet, reaching up with a pencil to mark the doorframe.
  Three faint earlier marks are visible below the current waterline. Her shadow falls
  long and dramatic across the surface of the floodwater. The two halves are divided
  by a thin vertical column of darkness — the same night, opposite ends of the world.
  Palette: the Swiss side warm amber and sage; the Thai side indigo, shadow, and lamplight
  gold. Style: atmospheric, literary YA illustration with strong use of light, shadow,
  and implied silence.'
