number: 10
text:
  en: 'The Steinbach Glacier at dusk does not look defeated. It looks like what it
    is: ancient, diminished, still present, still moving in its own way, still cold
    enough to keep the rock it rides on honest. Nik and Leo pushed the first measuring
    stake into the ice shelf at the new tongue''s edge — not a grand gesture, not
    a protest, just a mark, a datum, the beginning of a record that would outlast
    the season if they kept it. Nik wrote the date in the notebook, the coordinates
    from his phone, the air temperature, the distance from the previous survey stake
    Frau Becker had helped them identify from the university''s archive; he wrote
    carefully, the way Dao had taught him to write: *not what you feel about it; what
    it is.* What it was: smaller than last year, colder than it looked, pink at the
    edges in the alpenglow, and undeniably, measurably, still there. On the other
    side of the world, at that same hour of the afternoon — nine hours ahead, summer-warm,
    heavy with river smell — Dao was kneeling in the recovering mud of her father''s
    delta with a mangrove seedling in both hands. The mud held her knees gently, and
    the light came across the water flat and gold the way delta light comes, and her
    notebook lay open on a dry patch of ground beside her, waiting for one more entry.
    She pressed the seedling into the mud and held it there for a moment after she
    let go, making sure it would stay. Neither she nor Nik were fixing the world —
    they both knew this, had talked about it in the headlamp light, had felt the full
    enormous weight of what neither of them could do. But in the white gutter between
    two landscapes, between the glacier''s edge and the delta mud, a sentence belonged
    to both of them: *You don''t have to fix the whole world. You have to know which
    part of it is yours to carry.*'
  th: 'ยามโพล้เพล้ ธารน้ำแข็งสไตน์บัคไม่ได้ดูเหมือนสิ่งที่พ่ายแพ้ มันดูเหมือนสิ่งที่มันเป็น
    — โบราณ ลดน้อยถอยลง แต่ยังคงอยู่ ยังคงเคลื่อนไหวในแบบของมันเอง ยังเย็นพอที่จะทำให้หินที่มันทับอยู่ไม่กล้าโกหก
    นิคและเลโอตอกเสาวัดแรกลงบนชั้นน้ำแข็งที่ขอบปลายลิ้นใหม่ — ไม่ใช่ท่าทางอันยิ่งใหญ่
    ไม่ใช่การประท้วง เพียงแค่รอยสัญลักษณ์ ข้อมูลหนึ่งชิ้น จุดเริ่มต้นของบันทึกที่จะยืนนานข้ามฤดูกาลหากพวกเขาไม่ละทิ้งมัน
    นิคเขียนวันที่ลงในสมุดบันทึก พร้อมพิกัดจากโทรศัพท์ อุณหภูมิอากาศ และระยะห่างจากเสาสำรวจเดิมที่เฟราเบ็คเกอร์ช่วยพวกเขาค้นหาจากคลังข้อมูลของมหาวิทยาลัย
    เขาเขียนอย่างระมัดระวัง ในแบบที่ดาวสอนให้เขาเขียน: *ไม่ใช่สิ่งที่คุณรู้สึกต่อมัน
    แต่คือสิ่งที่มันเป็น* สิ่งที่มันเป็น: เล็กกว่าปีที่แล้ว เย็นกว่าที่มองเห็น ขอบระเรื่อเป็นสีชมพูในแสงอัลเพนโกลว์
    และยังคงอยู่อย่างปฏิเสธไม่ได้ วัดได้จริง ในอีกซีกโลกหนึ่ง ณ เวลาบ่ายเดียวกันนั้น
    — ล่วงหน้าไปเก้าชั่วโมง อุ่นดั่งหน้าร้อน หนักอบอวลด้วยกลิ่นแม่น้ำ — ดาวกำลังคุกเข่าอยู่ในโคลนของสามเหลี่ยมปากแม่น้ำของพ่อเธอ
    มือทั้งสองประคองกล้าโกงกางน้อยๆ ไว้ โคลนรับน้ำหนักหัวเข่าเธออย่างอ่อนโยน และแสงที่ลาดเอียงข้ามผิวน้ำนั้นราบและทองอย่างที่แสงในสามเหลี่ยมปากแม่น้ำมักเป็น
    สมุดบันทึกของเธอเปิดอยู่บนผืนดินแห้งข้างๆ รอการบันทึกครั้งสุดท้าย เธอกดกล้าไม้ลงในโคลนและถือมันไว้อีกสักครู่หลังปล่อยมือ
    เพื่อให้แน่ใจว่ามันจะอยู่ได้ ทั้งเธอและนิคต่างรู้ดีว่าพวกเขาไม่ได้กำลังซ่อมแซมโลก
    — รู้มาตลอด พูดคุยกันในแสงไฟฉายหัว รู้สึกถึงน้ำหนักอันมหึมาของสิ่งที่ทั้งคู่ทำไม่ได้
    แต่ในช่องว่างสีขาวระหว่างสองภูมิทัศน์นั้น ระหว่างขอบธารน้ำแข็งและโคลนสามเหลี่ยมปากแม่น้ำ
    มีประโยคหนึ่งที่เป็นของทั้งสองคน: *ไม่จำเป็นต้องซ่อมแซมโลกทั้งใบ แค่รู้ว่าส่วนไหนของมันคือส่วนที่เธอต้องแบกรับ*'
image_prompt: 'A split, mirror-composition illustration in a painterly, slightly desaturated
  style suited to literary young adult fiction. The page is divided diagonally — not
  harshly, but with a soft dissolve, as if the two worlds are breathing toward each
  other. LEFT HALF: The Steinbach Glacier at alpine dusk. The ice tongue''s new edge
  is rough and pale blue-grey, fissured with shadow. Alpenglow tints the uppermost
  seracs and ridgelines a dusty rose-gold. In the foreground, two teenage boys — Nik
  (mixed Swiss-Thai, dark-haired, lean, mid-teens) kneeling and writing in a battered
  field notebook; Leo (Swiss, stocky, fair, same age) standing beside him gripping
  a freshly driven survey stake — their breath visible in the cold air. The scene
  is quiet, matter-of-fact, scientific, yet luminous. RIGHT HALF: A Mekong delta at
  the same afternoon hour but nine hours ahead, saturated with flat golden river-light.
  The recovering mud is dark and rich, threaded with shallow water channels. In the
  foreground, a teenage Thai girl — Dao (slight, precise, determined, mid-teens) —
  kneels in the mud, pressing a small mangrove seedling into the earth with both hands,
  her open notebook visible on dry ground nearby. The light across the water is wide
  and low. The colour palette shifts from cool blue-violet (glacier side) to warm
  amber-gold (delta side), meeting in the centre where the two panels dissolve together.
  No text or labels. Mood: quiet resolve, vast scale made intimate, two solitudes
  in quiet conversation across distance.'
